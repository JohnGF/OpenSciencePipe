[project]
name = "opensciencepipe"
version = "0.1.0"
description = "End-to-end framework for autonomous science mapping and systematic evidence synthesis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "bertopic>=0.16.0",
  "networkx>=3.0",
  "python-louvain>=0.16",
  "pandas>=2.0.0,<2.2.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.0.0",
  "polars>=0.20.0",
  "pyarrow>=14.0.0",
  "pycountry>=22.0.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "altair>=5.0.0",
  "openpyxl>=3.1.0",
  "scikit-learn>=1.3.0",
  "numpy>=1.24.0,<2.0.0",
  "httpx>=0.27.0",
  "tenacity>=8.0.0",
  "pytest>=8.0.0",
  "pytest-mock>=3.12.0",
  "torch>=2.5.1,<2.9",
  "torchvision>=0.20.1,<0.24",
  "torchaudio>=2.5.1,<2.9",
  "pymupdf>=1.28.0",
]

[project.scripts]
opensciencepipe = "src.pipeline:main"
biblio-pipeline = "src.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
